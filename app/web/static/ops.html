<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/css/monetka.css">
<title>Monetka · Operator</title>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>
<header class="topbar">
  <a class="logo" href="app.html"><span class="coin" aria-hidden="true">₴</span>Monetka</a>
  <span class="who" data-i18n="ops.title"></span>
  <a class="btn small ghost" href="app.html" data-i18n="nav.wallet"></a>
  <button class="btn small ghost" type="button" data-action="lang" data-i18n="nav.lang">English</button>
  <button class="btn small ghost" type="button" data-action="theme" data-i18n-label="nav.theme" aria-label="Switch theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  <button class="btn small" type="button" data-action="signout" data-i18n="nav.signout"></button>
</header>
<main id="main" class="page stack">
  <p class="banner warn" id="denied" hidden data-i18n="ops.denied"></p>
  <section aria-label="Overview" class="tiles" id="tiles"></section>
  <section class="card" aria-labelledby="rec-title">
    <h2 id="rec-title" data-i18n="ops.reconciliation"></h2>
    <div class="tiles" id="reconciliation" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"></div>
    <button class="btn small" type="button" id="run" data-i18n="ops.runNow" style="margin-top:16px"></button>
  </section>
  <section class="card" aria-labelledby="journal-title">
    <h2 id="journal-title" data-i18n="ops.journal"></h2>
    <p class="muted" data-i18n="ops.journalHint"></p>
    <div class="table-wrap">
      <table class="journal">
        <thead><tr>
          <th scope="col" data-i18n="ops.colAccount"></th>
          <th scope="col" data-i18n="ops.colOwner"></th>
          <th scope="col" class="num" data-i18n="ops.colDebit"></th>
          <th scope="col" class="num" data-i18n="ops.colCredit"></th>
        </tr></thead>
        <tbody id="journal"></tbody>
      </table>
    </div>
  </section>
</main>
<script type="module" src="assets/js/ops.js"></script>
</body>
</html>
