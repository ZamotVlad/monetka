x-app: &app
  build: .
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-monetka}:${POSTGRES_PASSWORD:-monetka}@postgres:5432/${POSTGRES_DB:-monetka}
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    S3_ENDPOINT_URL: http://localstack:4566
    S3_PUBLIC_ENDPOINT_URL: http://localhost:4566
    PUBLIC_URL: http://localhost:8000
    PSP_CHECKOUT_URL: http://localhost:8001/checkout
    PSP_CALLBACK_URL: http://api:8000/api/v1/webhooks/psp
    PSP_SECRET: ${PSP_SECRET:-local-dev-psp-secret-change-me-in-production}
    AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
    TEST_MONEY_ENABLED: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monetka}
      POSTGRES_USER: ${POSTGRES_USER:-monetka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monetka}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka-compatible broker in one container, no ZooKeeper
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # AWS S3 on the laptop: statements go here instead of a paid bucket
  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    <<: *app
    command: ["python", "-m", "app.workers"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      localstack:
        condition: service_healthy

  psp:
    <<: *app
    command: ["uvicorn", "psp_mock.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PSP_SECRET: ${PSP_SECRET:-local-dev-psp-secret-change-me-in-production}
    ports:
      - "8001:8001"
    healthcheck:
      disable: true

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
